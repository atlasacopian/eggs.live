name: Bird Flu Data (WAHIS)

on:
  schedule:
    - cron: '0 8 * * *'  # daily at 08:00 UTC
  workflow_dispatch:

jobs:
  fetch-birdflu-wahis:
    runs-on: ubuntu-latest
    concurrency:
      group: bird-flu-wahis
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y WOAH_WAHIS.ReportRetriever || true
          pip install --no-cache-dir supabase python-dotenv
      - name: Clone WAHIS retriever
        run: git clone https://github.com/loicleray/WOAH_WAHIS.ReportRetriever.git wahis-retriever
      - name: List cloned repository
        run: ls -la wahis-retriever
      - name: Fetch & upsert WAHIS HPAI data
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/wahis-retriever
          python scripts/fetch-birdflu-wahis.py 