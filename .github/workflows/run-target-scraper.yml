name: Run Target Egg Price Scraper

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: {}

jobs:
  scrape-target-prices:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      REDSKY_KEY: ${{ secrets.REDSKY_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Create .env.local
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env.local
          echo "SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}" >> .env.local
          echo "REDSKY_KEY=${{ secrets.REDSKY_KEY }}" >> .env.local

      - name: Install dependencies
        run: npm ci

      - name: Run Target scraper
        run: node scripts/fetch-target-prices.js

      - name: Complete
        run: echo "✅ Completed scraping and upserting Target egg prices." 