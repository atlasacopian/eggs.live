name: Kroger Egg Prices

on:
  schedule:
    # Midnight Los Angeles time. Because GitHub cron is in UTC, schedule both 07:00 (PDT) and 08:00 (PST) UTC to always cover midnight.
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  fetch_prices:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Set a reasonable timeout for the job
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - start_at: 0
            max_stores: 600
          - start_at: 600
            max_stores: 600
          - start_at: 1200
            max_stores: 600
          - start_at: 1800
            max_stores: 600
          - start_at: 2400
            max_stores: 600
    concurrency:
      group: kroger-prices-${{ matrix.start_at }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      START_AT: ${{ matrix.start_at }}
      MAX_STORES_PER_RUN: ${{ matrix.max_stores }}
      NODE_ENV: production # Optional: good practice for scripts
      CONCURRENCY: '1'
      STORE_DELAY_MS: '5000'
      PAGE_DELAY_MS: '2000'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # Specify your Node.js version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run price fetching script (partition starting at ${{ matrix.start_at }})
        run: node scripts/fetch-kroger-egg-prices.js 