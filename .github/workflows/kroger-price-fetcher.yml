name: Kroger Egg Prices

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch prices
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1        # run partitions sequentially - the Bottleneck
                              # rate limiter is per-process, so running
                              # partitions concurrently would double the true
                              # Kroger-facing request rate past 1 rps.
      matrix:
        include:
          # Now tracking all ~2,893 known Kroger-family stores (was 1,500) -
          # split across 3 partitions to keep each job well under the
          # 360-min timeout even as the store count grows.
          - start_at: 0
            max_stores: 1000
          - start_at: 1000
            max_stores: 1000
          - start_at: 2000
            max_stores: 1000
    concurrency:
      group: kroger-prices-${{ matrix.start_at }}
      cancel-in-progress: false
    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
      KROGER_CLIENT_ID:      ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET:  ${{ secrets.KROGER_CLIENT_SECRET }}
      START_AT:              ${{ matrix.start_at }}
      MAX_STORES_PER_RUN:    ${{ matrix.max_stores }}
      NODE_ENV:              production
      RATE_LIMIT_RPS:        '1'
      MAX_CONCURRENT_REQUESTS: '3'
      CONCURRENCY:           '3'
      MAX_CONSECUTIVE_SKIPS: '100'
      SHUFFLE_STORES:        '1'
      PAGE_DELAY_MS:         '500'
      STORE_DELAY_MS:        '250'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Validate secrets
        run: bash scripts/ci-require-env.sh SUPABASE_URL SUPABASE_SERVICE_KEY KROGER_CLIENT_ID KROGER_CLIENT_SECRET
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      - run: node scripts/fetch-kroger-egg-prices.js 