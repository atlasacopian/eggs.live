name: Kroger Egg Prices

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch:
    name: Fetch prices
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: true
      max-parallel: 1        # run the two partitions sequentially
      matrix:
        include:
          - start_at: 0
            max_stores: 750
          - start_at: 750
            max_stores: 750
    concurrency:
      group: kroger-prices-${{ matrix.start_at }}
      cancel-in-progress: false
    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
      KROGER_CLIENT_ID:      ${{ secrets.KROGER_CLIENT_ID }}
      KROGER_CLIENT_SECRET:  ${{ secrets.KROGER_CLIENT_SECRET }}
      START_AT:              ${{ matrix.start_at }}
      MAX_STORES_PER_RUN:    ${{ matrix.max_stores }}
      NODE_ENV:              production
      RATE_LIMIT_RPS:        '1'
      MAX_CONCURRENT_REQUESTS: '3'
      CONCURRENCY:           '1'
      MAX_CONSECUTIVE_SKIPS: '100'
      SHUFFLE_STORES:        '1'
      PAGE_DELAY_MS:         '500'
      STORE_DELAY_MS:        '250'
      KROGER_STORES_TABLE:   kroger_stores_1500

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Validate secrets
        run: bash scripts/ci-require-env.sh SUPABASE_URL SUPABASE_SERVICE_KEY KROGER_CLIENT_ID KROGER_CLIENT_SECRET
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
      - run: node scripts/fetch-kroger-egg-prices.js 