name: National Daily (USDA)

on:
  # Runs daily at midnight Los Angeles Time (approx. 07:00 UTC during PDT)
  schedule:
    - cron: '0 7 * * *' # Midnight PDT (UTC-7)
  # Allow a manual run from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run USDA backfill (latest only)
        run: node scripts/backfill-usda-weekly.js --latest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }} 