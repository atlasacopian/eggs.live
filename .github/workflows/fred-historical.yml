name: National Historical (FRED)

on:
  schedule:
    # Runs every day at midnight Los Angeles time (07:00 UTC during PDT, 08:00 UTC during PST)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  update: # This is the FRED job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci

      - name: Run updater script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/update-fred-egg-price.js
