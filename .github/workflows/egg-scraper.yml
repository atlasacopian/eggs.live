name: Target Egg Prices

# Nightly schedule disabled 2026-10-11: Target put RedSky behind PerimeterX
# bot protection and every store has returned HTTP 435 since mid-2025.
# Existing target_egg_prices history is kept and still shown on the site.
# Manual trigger left in place for testing a future data source.
on:
  workflow_dispatch: {}    # manual trigger in UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      REDSKY_KEY: ${{ secrets.REDSKY_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate secrets
        run: bash scripts/ci-require-env.sh SUPABASE_URL SUPABASE_SERVICE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Run RedSky API scraper
        run: node scripts/fetch-target-egg-prices-intercept.js

      - name: Success
        run: echo "✅ Daily egg prices fetched and upserted" 