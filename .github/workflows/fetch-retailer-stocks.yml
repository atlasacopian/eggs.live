name: Fetch Retailer Stock Quotes

on:
  schedule:
    # Every 15 minutes during US market hours
    - cron: '*/15 14-21 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-stocks:
    runs-on: ubuntu-latest
    concurrency:
      group: retailer-stocks
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Fetch & upsert retailer quotes
        run: node scripts/fetch-retailer-stocks.js 