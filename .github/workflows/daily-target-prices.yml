name: Target US Egg Prices (daily)

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: {}

jobs:
  fetch-target-prices:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      REDSKY_KEY: ${{ secrets.REDSKY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Run fetch script
        run: node scripts/fetch-target-egg-prices-intercept.js

      - name: Done
        run: echo "✅ Target egg price stats collected and saved to Supabase."
