name: Fetch Egg Stock Quotes

on:
  schedule:
    # Every 15 minutes during US market hours (14:00–21:59 UTC ≈ 09:00–16:59 ET)
    - cron: '*/15 14-21 * * 1-5'
  workflow_dispatch:

jobs:
  fetch-stocks:
    runs-on: ubuntu-latest
    concurrency:
      group: egg-stocks
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch & Upsert Egg Stock Quotes
        run: node scripts/fetch-egg-stocks.js 