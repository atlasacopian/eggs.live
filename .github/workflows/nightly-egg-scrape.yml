name: Nightly egg-price import

on:
  schedule:
    # ┌ min (0-59)
    # │ ┌ hour (0-23, UTC)
    # │ │ ┌ day of month (1-31)
    # │ │ │ ┌ month (1-12)
    # │ │ │ │ ┌ day of week (0-6 or SUN-SAT)
    # │ │ │ │ │
    - cron: '0 0 * * *'       # every day at 00:00 UTC
  workflow_dispatch:          # allow manual trigger from the GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts

      - name: Run egg-price scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
        run: |
          npm run update-eggs || npm run scrape-eggs || node scripts/fetch-egg-prices.js 