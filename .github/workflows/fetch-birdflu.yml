name: Fetch Bird Flu Data

on:
  schedule:
    - cron: '0 12 * * *' # once daily at 12:00 UTC (~08:00 ET)
  workflow_dispatch:

jobs:
  fetch-birdflu:
    runs-on: ubuntu-latest
    concurrency:
      group: bird-flu
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Fetch & upsert bird flu data
        run: node scripts/fetch-birdflu-us.js 