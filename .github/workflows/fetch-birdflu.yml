name: Fetch Bird Flu Data

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  fetch-birdflu:
    name: Fetch Bird Flu Data
    runs-on: ubuntu-latest
    concurrency:
      group: bird-flu
      cancel-in-progress: false
    env:
      SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Fetch CDC bird flu outbreak data (commercial & backyard flocks)
        run: node scripts/fetch-birdflu-cdc-outbreaks.js
      - name: Fetch USDA bird flu outbreak data (fallback for depop status)
        run: node scripts/fetch-birdflu-us.js
      - name: Fetch CDC bird flu exposure & summary data
        run: node scripts/fetch-birdflu-cdc.js 