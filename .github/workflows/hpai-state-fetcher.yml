name: HPAI State Fetcher

on:
  workflow_dispatch: {}
  schedule:
    - cron: '10 7 * * *'  # every day at 07:10 UTC

jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install deps
        run: npm ci
      - name: Validate secrets
        run: bash scripts/ci-require-env.sh SUPABASE_URL SUPABASE_SERVICE_KEY
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Run HPAI state ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NODE_OPTIONS: '--no-warnings'
        run: node scripts/fetch-hpai-aphis-state.js 